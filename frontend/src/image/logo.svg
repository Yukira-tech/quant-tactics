<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="StrategyEngine 星星 K 线精灵">
  <!-- 二次元 logo：圆润五角星精灵（樱粉身体 + 粗暖棕描边），头顶蜜桃 K 线蜡烛天线 -->
  <!-- 星形身体（stroke-linejoin=round + 粗描边 = 圆润手感） -->
  <path d="M24 12 L27.8 21.7 L38.3 22.4 L30.2 29 L32.8 39.1 L24 33.5 L15.2 39.1 L17.8 29 L9.7 22.4 L20.2 21.7 Z"
        fill="#ffd3e0" stroke="#54453f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 头顶 K 线蜡烛天线：烛芯 + 蜜桃烛身（粗描边） -->
  <line x1="24" y1="3.2" x2="24" y2="7.6" stroke="#54453f" stroke-width="2" stroke-linecap="round"/>
  <rect x="20.8" y="7.4" width="6.4" height="5.2" rx="1.8"
        fill="#ffb583" stroke="#54453f" stroke-width="2"/>
  <!-- 豆豆眼（带高光） -->
  <circle cx="19" cy="26" r="1.7" fill="#54453f"/>
  <circle cx="29" cy="26" r="1.7" fill="#54453f"/>
  <circle cx="19.6" cy="25.4" r="0.55" fill="#fffdfb"/>
  <circle cx="29.6" cy="25.4" r="0.55" fill="#fffdfb"/>
  <!-- 蜜桃腮红 -->
  <ellipse cx="15.6" cy="29.4" rx="2.2" ry="1.3" fill="#ffb583" opacity="0.75"/>
  <ellipse cx="32.4" cy="29.4" rx="2.2" ry="1.3" fill="#ffb583" opacity="0.75"/>
  <!-- 微笑 -->
  <path d="M22.3 29.8 Q24 31.4 25.7 29.8" fill="none" stroke="#54453f" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 小装饰：四角星 + 蜜桃圆点 -->
  <path d="M38.5 5.5 C39 7.5 40 8.5 42 9 C40 9.5 39 10.5 38.5 12.5 C38 10.5 37 9.5 35 9 C37 8.5 38 7.5 38.5 5.5 Z" fill="#ff9ebb"/>
  <circle cx="8.5" cy="13.5" r="1.6" fill="#ffb583"/>
</svg>
