<template id="tpl-signal-row">
  <tr class="pop-in">
    <td class="num" data-f="symbol">------</td>
    <td><span class="badge badge-hold" data-f="signal">持有</span></td>
    <td>
      <span class="strength"><i data-f="strength" style="width: 0%"></i></span><span class="num dim" data-f="strength-text">0.00</span>
    </td>
    <td class="dim" data-f="source">—</td>
    <td class="num dim" data-f="time">--:--:--</td>
  </tr>
</template>
